<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Catálogo | Mon Impasse</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#282321;background:#faf8f5;line-height:1.6}.shipping-banner{background:#eee6e0;color:#4b433e;text-align:center;padding:9px 14px;font-size:11px;letter-spacing:1.8px}.catalog-page{padding:65px 7% 80px}.catalog-heading{text-align:center;max-width:760px;margin:0 auto 45px}.catalog-heading h1{font-family:Georgia,serif;font-size:48px;font-weight:400}.catalog-heading p{color:#81766f;font-size:14px}.products{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.product{background:#fff;overflow:hidden;box-shadow:0 5px 20px rgba(70,55,45,.07)}.product-image{width:100%;height:270px;object-fit:contain;background:#fff;padding:8px;display:block;cursor:pointer}.product-info{padding:18px}.product h3{font-family:Georgia,serif;font-size:21px;font-weight:400;margin-bottom:7px}.product-info p{font-size:13px;color:#776d67;margin-bottom:12px}.price{font-family:Georgia,serif;font-size:22px;margin:8px 0 14px}.button{display:inline-block;background:#c9b2a5;color:#fff;text-decoration:none;padding:15px 31px;border:0;cursor:pointer;font-size:11px;letter-spacing:3px;text-transform:uppercase}.view-product{width:100%}.back-home{text-align:center;margin-top:45px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-box{background:#fff;max-width:900px;width:100%;max-height:92vh;overflow:auto;position:relative;padding:25px}.close{position:absolute;right:18px;top:12px;border:0;background:none;font-size:30px;cursor:pointer}.modal-grid{display:grid;grid-template-columns:1fr;gap:24px}.modal-image{width:100%;height:500px;object-fit:contain;background:#fff;display:block;cursor:zoom-in}.zoom-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}.zoom-overlay.open{display:flex}.zoom-overlay img{max-width:95vw;max-height:95vh;object-fit:contain}.modal-thumbnails{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.modal-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;border:2px solid transparent;cursor:pointer}.modal-thumb.active{border-color:#c9b2a5}.modal-info{max-width:720px;margin:auto;width:100%}.modal-info h2{font-family:Georgia,serif;font-size:36px;font-weight:400;margin-bottom:12px}.modal-info p{color:#756a64;margin-bottom:16px}.modal-price{font-family:Georgia,serif;font-size:28px;margin-bottom:20px}.fabric-label{display:block;font-weight:bold;margin-bottom:8px}.fabric-select{width:100%;padding:13px;border:1px solid #d9cec6;background:#fff;font-size:16px}.personal-box{background:#fff;border:1px solid #e8ded7;padding:15px;margin-top:18px}.personal-row{display:flex;align-items:center;gap:9px}.name-input{width:100%;padding:11px;border:1px solid #d9cec6;margin-top:10px}.add-cart{width:100%;margin-top:18px}.note{font-size:13px;color:#756a64;margin-top:15px}@media(max-width:850px){.products{grid-template-columns:1fr 1fr}.modal-box{padding:18px}.modal-image{height:430px}}@media(max-width:560px){.catalog-page{padding:50px 18px}.products{grid-template-columns:1fr}.catalog-heading h1{font-size:34px}.modal-image{height:320px}.modal-info h2{font-size:32px}}
</style>
</head>
<body>
<div class="shipping-banner">ENVÍOS PENÍNSULA 4,99 € · GRATIS DESDE 50 € · CANARIAS, CEUTA Y MELILLA 7,99 €</div>
<main class="catalog-page"><div class="catalog-heading"><h1>Catálogo</h1><p>Descubre nuestras piezas hechas a mano y elige tu favorita.</p></div><div id="catalogo" class="products"></div><div class="back-home"><a class="button" href="catalogo.html">Volver al catálogo</a></div></main>
<div class="zoom-overlay" id="zoomOverlay" onclick="closeZoom()"><img id="zoomImage" src="" alt=""></div><div class="modal" id="modal"><div class="modal-box"><button class="close" onclick="closeProduct()">×</button><div class="modal-grid"><section><img id="modal-image" class="modal-image" src="" alt="" onclick="openZoom()"><div id="modal-thumbnails" class="modal-thumbnails"></div></section><section class="modal-info"><h2 id="modal-name"></h2><p id="modal-description"></p><div id="modal-price" class="modal-price"></div><label class="fabric-label">Elige tu tela</label><select id="fabric" class="fabric-select" onchange="changeFabric()"></select><div id="personal-area"></div><button class="button add-cart" onclick="addToCart()">Añadir al carrito</button><p class="note">Cada pieza se confecciona bajo pedido.</p></section></div></div></div>
<script>
const standardFabrics=[['Animal print lila','6D28E075-B225-4C12-9754-C0A3B697CF41.png'],['Animal print marrón','BDC93116-C83D-40A4-8C72-ABDC236857A1.png'],['Perritos azul','C3748FB5-B11E-4675-B1C0-51BE4D333829.png'],['Animal print azul','37AE8F00-7105-4271-B1BF-BF2501A64952.png'],['Vichy gris grande','C0C87334-0E0A-441D-B9A7-0E1B4DE5EFB2.png']];
const basicFabrics=[['Perritos marineros','assets/594B737C-1928-4FA1-AE01-AA2ECD57718B.png'],['Animal print azul','assets/ABBC2D5C-6666-4AA6-A835-C50142602803.png'],['Vichy negro','assets/B4AFE84F-96BF-4DAA-824F-9F6E20F7DC9A.png'],['Floral lila','assets/E5AA1D38-4BE0-49C5-877B-93C78F839C79.png'],['Animal print marrón','assets/1B3B20ED-BCA8-4291-8FD2-3B8D52C6595D.png']];
const totebagFabrics=[
{name:'Perros marineros',images:['assets/1A66E052-EF57-4A08-8DAD-6E2E88812AA3.png','assets/totebag_perritos.webp']},
{name:'Animal print lila',images:['assets/19D97C3D-68DE-4F0D-9613-CA77525FC15F.png','assets/totebag_lila.webp']},
{name:'Animal print marrón',images:['assets/5EA4AA7B-48EF-4F9C-97A9-8E0A87D27CB6.png','assets/totebag_marron.webp']},
{name:'Animal print azul',images:['assets/1B1B2CDA-540F-4D12-ABA9-996FECEE8FC8.png','assets/totebag_turquesa.webp']},
{name:'Vichy negro',images:['assets/8CCC90A3-9263-44CC-BB5F-BB31EAB258DC.png','assets/totebag_vichy.webp']}];
const bibFabrics=[['Perritos marineros','6083EF3A-6459-4734-B4B9-42502522F1EB.png'],['Avionetas fondo blanco','558EE6C4-C23E-4327-8E60-269D6CC8B501.png'],['Perritos rosa','927E82D1-AC54-4A7B-A7F9-FE051D964D6E.png'],['Perritos azul claro','90A6C050-2F35-4CC7-BD77-1624B896D29A.png'],['Hipopótamos rosa','0AA88434-7DB8-42AE-A699-75E4C53C092F.png']];
const lanyardFabrics=[
{name:'Lila animal print',images:['assets/912731BA-8A72-4B42-B24F-E250207A5F6A.png','assets/B30D5DEC-4941-4A0D-BA24-58F386CA413E.jpeg']},
{name:'Turquesa animal print',images:['assets/A9770395-0D6C-48A7-B578-A2987397AF39.png','assets/D3005FCC-491D-4CCA-B118-D392A2FA6E59.jpeg']},
{name:'Azul animal print',images:['assets/821BDE51-4DAA-439B-BD80-F3371A587C2A.png','assets/A494EE46-C1C0-44E3-87E8-4751FFB824A0.jpeg']},
{name:'Teja animal print',images:['assets/A6C727DA-6C65-4272-97F6-6318FE8F6E81.png','assets/49273B60-4FF0-46E6-B1C5-FC2E32C0369E.png']}];
const products=[{name:'Bolsa',price:25,image:'assets/8CCC90A3-9263-44CC-BB5F-BB31EAB258DC.png',description:'Una bolsa práctica y especial, confeccionada a mano.',fabrics:totebagFabrics,personal:true},{name:'Neceser S',price:15,image:'BDC93116-C83D-40A4-8C72-ABDC236857A1.png',description:'Un neceser pequeño, práctico y bonito, ideal para llevar tus imprescindibles.',fabrics:standardFabrics,personal:true},{name:'Neceser Basic',price:20,image:'assets/B4AFE84F-96BF-4DAA-824F-9F6E20F7DC9A.png',description:'Un diseño espacioso, práctico y hecho a mano.',fabrics:basicFabrics},{name:'Babero',price:10,image:'927E82D1-AC54-4A7B-A7F9-FE051D964D6E.png',description:'Babero artesanal, disponible en diferentes estampados y tejidos.',fabrics:bibFabrics,personal:true},{name:'Lanyard',price:10,image:'assets/B30D5DEC-4941-4A0D-BA24-58F386CA413E.jpeg',description:'Lanyard elástico artesanal con estampado animal print.',fabrics:lanyardFabrics}];
let current=null;
function withCache(src){return src+(src.includes('?')?'&':'?')+'v=15'}
function renderProducts(){document.getElementById('catalogo').innerHTML=products.map((p,i)=>'<article class="product"><img class="product-image" src="'+withCache(p.image)+'" alt="'+p.name+'" onclick="openProduct('+i+')"><div class="product-info"><h3>'+p.name+'</h3><p>'+p.description+'</p><div class="price">'+p.price+' €</div><button class="button view-product" onclick="openProduct('+i+')">Ver producto</button></div></article>').join('')}
function renderFabricThumbs(i){const x=current.fabrics[i],images=x.images||[x[1]];document.getElementById('modal-thumbnails').innerHTML=images.map((src,k)=>'<img class="modal-thumb '+(k===0?'active':'')+'" src="'+withCache(src)+'" alt="'+(x.name||x[0])+' - foto '+(k+1)+'" onclick="selectThumb('+k+')">').join('');document.getElementById('modal-image').src=withCache(images[0])}
function openProduct(i){current=products[i];document.getElementById('modal-name').textContent=current.name;document.getElementById('modal-description').textContent=current.description;document.getElementById('modal-price').textContent=current.price+' €';const list=current.fabrics||[];document.getElementById('fabric').innerHTML=list.map((x,j)=>'<option value="'+(x.name||x[0])+'">'+(x.name||x[0])+'</option>').join('');renderFabricThumbs(0);document.getElementById('personal-area').innerHTML=current.personal?'<div class="personal-box"><div><strong>Personalización</strong></div><div class="personal-row"><input type="radio" name="personalType" value="none" checked><label>Sin personalizar</label></div><div class="personal-row"><input type="radio" name="personalType" value="name"><label>Nombre (+5 €)</label></div><div class="personal-row"><input type="radio" name="personalType" value="initial"><label>Inicial (+3 €)</label></div><div id="personalInputWrap" style="display:none"><input id="personalInput" class="name-input" type="text" maxlength="20" placeholder="Nombre o inicial"></div></div>':'';document.querySelectorAll('input[name="personalType"]').forEach(r=>r.addEventListener('change',function(){document.getElementById('personalInputWrap').style.display=this.value==='none'?'none':'block'}));document.getElementById('modal').classList.add('open')}
function openZoom(){document.getElementById("zoomImage").src=document.getElementById("modal-image").src;document.getElementById("zoomOverlay").classList.add("open")}function closeZoom(){document.getElementById("zoomOverlay").classList.remove("open")}function selectThumb(k=0){const i=document.getElementById('fabric').selectedIndex;const x=current.fabrics[i],images=x.images||[x[1]];document.getElementById('modal-image').src=withCache(images[k]);document.querySelectorAll('.modal-thumb').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.modal-thumb')[k]?.classList.add('active')}function changeFabric(){renderFabricThumbs(document.getElementById('fabric').selectedIndex)}function closeProduct(){document.getElementById('modal').classList.remove('open')}
function addToCart(){alert('Producto listo para añadir al carrito.')}renderProducts();
</script>
</body>
</html>
