<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mon Impasse | Producto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#514943;background:#faf8f5;line-height:1.6}header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #eee6df}.logo{font-family:Georgia,serif;font-size:30px;letter-spacing:2px}.tagline{font-size:12px;letter-spacing:2px;color:#9a857a;margin-top:3px}.back{display:inline-block;margin-top:15px;color:#514943;text-decoration:none}.product-page{max-width:1000px;margin:40px auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:50px}.product-photo{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}.thumbnails{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#fff;border:2px solid transparent;cursor:pointer}.thumb.active{border-color:#514943}.product-info h1{font-family:Georgia,serif;font-size:42px;font-weight:normal;margin-bottom:15px}.description{color:#756a64;margin-bottom:25px}.price{font-family:Georgia,serif;font-size:30px;margin-bottom:30px}.characteristics{border-top:1px solid #e8ded7;border-bottom:1px solid #e8ded7;padding:20px 0;margin-bottom:25px}.characteristics p{margin:7px 0;color:#756a64}.field{margin-top:22px}.fabric-label,.personal-label{display:block;font-weight:bold;margin-bottom:8px}.fabric-select,.name-input{width:100%;padding:13px;border:1px solid #d9cec6;background:#fff;font-size:16px}.personal-box{background:#fff;padding:18px;margin-top:10px;border:1px solid #e8ded7}.personal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}.name-input{margin-top:8px}.note{font-size:14px;color:#756a64;margin-top:20px}.buy-button{display:block;width:100%;margin-top:24px;padding:15px 20px;background:#514943;color:#fff;text-align:center;text-decoration:none;font-size:16px;cursor:pointer;border:0}.buy-button:hover{opacity:.92}@media(max-width:700px){.product-page{grid-template-columns:1fr;gap:25px;margin:20px auto}.product-info h1{font-size:34px}}
.characteristics{margin:10px 0 18px}.characteristics p{margin:5px 0}.characteristics + .price{margin-top:4px}</style></head>
<body>
<header><div class="logo">Mon Impasse</div><div class="tagline">HECHO A MANO CON MUCHO CARIÑO</div><a class="back" href="catalogo.html">← Volver al catálogo</a></header>
<main class="product-page">
<section><img id="productPhoto" class="product-photo" src="" alt="" loading="eager"><div class="thumbnails" id="thumbnails"></div></section>
<section class="product-info"><h1 id="productName"></h1><p id="description" class="description"></p><div id="characteristics" class="characteristics"></div><div id="price" class="price"></div>
<div class="field"><label class="fabric-label" for="fabricSelect">Elige tu tela</label><select id="fabricSelect" class="fabric-select"></select></div>
<div id="personalArea"></div><button id="addButton" class="buy-button" type="button" onclick="addToCart()">Añadir a la cesta</button>
<p class="note">El estampado puede variar ligeramente según el corte de la tela.</p></section></main>
<script>
const standardFabrics=[['Animal print lila','6D28E075-B225-4C12-9754-C0A3B697CF41.png'],['Animal print marrón','BDC93116-C83D-40A4-8C72-ABDC236857A1.png'],['Perritos azul','C3748FB5-B11E-4675-B1C0-51BE4D333829.png'],['Animal print azul','37AE8F00-7105-4271-B1BF-BF2501A64952.png'],['Vichy gris grande','C0C87334-0E0A-441D-B9A7-0E1B4DE5EFB2.png']];
const basicFabrics=[['Perritos marineros','assets/594B737C-1928-4FA1-AE01-AA2ECD57718B.png'],['Animal print azul','assets/ABBC2D5C-6666-4AA6-A835-C50142602803.png'],['Vichy negro','assets/B4AFE84F-96BF-4DAA-824F-9F6E20F7DC9A.png'],['Floral lila','assets/E5AA1D38-4BE0-49C5-877B-93C78F839C79.png'],['Animal print marrón','assets/1B3B20ED-BCA8-4291-8FD2-3B8D52C6595D.png']];
const totebagFabrics=[['Perros marineros','assets/1A66E052-EF57-4A08-8DAD-6E2E88812AA3.png'],['Animal print lila','assets/19D97C3D-68DE-4F0D-9613-CA77525FC15F.png'],['Animal print marrón','assets/5EA4AA7B-48EF-4F9C-97A9-8E0A87D27CB6.png'],['Animal print azul','assets/1B1B2CDA-540F-4D12-ABA9-996FECEE8FC8.png'],['Vichy negro','assets/8CCC90A3-9263-44CC-BB5F-BB31EAB258DC.png']];
const bibFabrics=[['Perritos marineros','6083EF3A-6459-4734-B4B9-42502522F1EB.png'],['Avionetas fondo blanco','558EE6C4-C23E-4327-8E60-269D6CC8B501.png'],['Perritos rosa','927E82D1-AC54-4A7B-A7F9-FE051D964D6E.png'],['Perritos azul claro','90A6C050-2F35-4CC7-BD77-1624B896D29A.png'],['Hipopótamos rosa','0AA88434-7DB8-42AE-A699-75E4C53C092F.png']];
const products=[
{name:'Bolsa',price:25,image:'assets/8CCC90A3-9263-44CC-BB5F-BB31EAB258DC.png',description:'Una bolsa práctica y especial, confeccionada a mano.',fabrics:totebagFabrics,personal:true,characteristics:['Estampado en tela impermeable','Hecha a mano','Cada pieza se confecciona bajo pedido']},
{name:'Neceser S',price:15,image:'BDC93116-C83D-40A4-8C72-ABDC236857A1.png',description:'Un neceser pequeño, práctico y bonito, ideal para llevar tus imprescindibles.',fabrics:standardFabrics,personal:true,characteristics:['Tela impermeable','Hecho a mano','Cada pieza se confecciona bajo pedido']},
{name:'Neceser Basic',price:20,image:'assets/B4AFE84F-96BF-4DAA-824F-9F6E20F7DC9A.png',description:'Un diseño espacioso, práctico y hecho a mano.',fabrics:basicFabrics,characteristics:['Tela impermeable','Hecho a mano','Cada pieza se confecciona bajo pedido']},
{name:'Babero',price:10,image:'927E82D1-AC54-4A7B-A7F9-FE051D964D6E.png',description:'Babero artesanal, disponible en diferentes estampados y tejidos.',fabrics:bibFabrics,personal:true,characteristics:['Parte delantera de tela impermeable','Parte trasera de tela de rizo','Hecho a mano','Diferentes estampados disponibles'] }];
const i=Math.max(0,Math.min(products.length-1,Number(new URLSearchParams(location.search).get('producto'))||0)),current=products[i];
const photo=document.getElementById('productPhoto'),select=document.getElementById('fabricSelect'),thumbs=document.getElementById('thumbnails');
document.title='Mon Impasse | '+current.name;document.getElementById('productName').textContent=current.name;document.getElementById('description').textContent=current.description;document.getElementById('characteristics').innerHTML=current.characteristics.map(x=>'<p>✓ '+x+'</p>').join('');document.getElementById('price').textContent=current.price+' €';photo.src=current.image;photo.alt=current.name;
select.innerHTML=current.fabrics.map(x=>'<option value="'+x[0]+'" data-image="'+x[1]+'">'+x[0]+'</option>').join('');
thumbs.innerHTML=current.fabrics.map((x,j)=>'<img class="thumb '+(j===0?'active':'')+'" src="'+x[1]+'?v=12" alt="'+x[0]+'" onclick="selectFabric('+j+')">').join('');
function selectFabric(j){select.selectedIndex=j;changeFabric()}function changeFabric(){const o=select.options[select.selectedIndex];photo.src=o.dataset.image+'?v=12';photo.alt=current.name+' - '+o.value;document.querySelectorAll('.thumb').forEach((t,j)=>t.classList.toggle('active',j===select.selectedIndex))}
select.addEventListener('change',changeFabric);
if(current.personal){document.getElementById('personalArea').innerHTML='<div class="field"><span class="personal-label">Personalización</span><div class="personal-box"><div class="personal-row"><input type="radio" name="personalType" value="none" checked><label>Sin personalizar</label></div><div class="personal-row"><input type="radio" name="personalType" value="name"><label>Nombre (+5 €)</label></div><div class="personal-row"><input type="radio" name="personalType" value="initial"><label>Inicial (+3 €)</label></div><div id="personalInputWrap" style="display:none"><input id="personalInput" class="name-input" type="text" maxlength="20" placeholder="Escribe el nombre o la inicial"></div></div></div>';document.querySelectorAll('input[name="personalType"]').forEach(r=>r.addEventListener('change',function(){document.getElementById('personalInputWrap').style.display=this.value==='none'?'none':'block'}))}
function addToCart(){const fabric=select.value,type=document.querySelector('input[name="personalType"]:checked')?.value||'none',value=type!=='none'?(document.getElementById('personalInput')?.value.trim()||'Sin indicar'):'';const extra=type==='name'?5:type==='initial'?3:0;let cart=JSON.parse(localStorage.getItem('monImpasseCart')||'[]'),key=current.name+'|'+fabric+'|'+type+'|'+value,existing=cart.find(x=>x.key===key);if(existing)existing.qty++;else cart.push({key,name:current.name,price:current.price+extra,basePrice:current.price,personalized:value,image:select.options[select.selectedIndex].dataset.image,fabric,qty:1});localStorage.setItem('monImpasseCart',JSON.stringify(cart));document.getElementById('addButton').textContent='✓ Añadido a la cesta';setTimeout(()=>document.getElementById('addButton').textContent='Añadir a la cesta',1400)}
</script></body></html>
