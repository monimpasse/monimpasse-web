<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Impasse · Administración</title><!-- admin-login-fix -->
<style>
body{font-family:Arial,sans-serif;background:#faf8f5;color:#292421;margin:0}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-family:Georgia,serif;font-size:30px}.button{border:0;background:#c9b2a5;color:white;padding:11px 16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;padding:20px;border:1px solid #eee1d9}.label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#81766f}.num{font:28px Georgia,serif;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;padding:20px;border:1px solid #eee1d9}.panel h2{font:24px Georgia,serif;margin:0 0 15px}.bar{display:flex;gap:5px;align-items:flex-end;height:170px;border-bottom:1px solid #ddd}.bar i{display:block;background:#c9b2a5;min-width:18px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee6df;padding:10px 0;font-size:13px}.orders{margin-top:18px}.status{padding:4px 8px;background:#eee6df;font-size:11px}.muted{color:#81766f;font-size:12px}.error{text-align:center;padding:60px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{border:1px solid #d9cec6;background:#fff;padding:8px 12px;cursor:pointer}.filters button.active{background:#332e2b;color:#fff}@media(max-width:750px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="logo">Mon Impasse</div><div class="muted">Panel de administración</div></div><button class="button" onclick="logout()">Cerrar sesión</button></div>
<div id="app">Comprobando acceso…</div></div>
<script type="module">import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const URL='https://pgunvsjrytujpkjbwyaz.supabase.co',KEY='sb_publishable_0rYYngytqQIWsQ2oKL7VsA_MwybRQWA',sb=createClient(URL,KEY);
const labels={pending:'Pendiente',paid:'Pagado',preparing:'En preparación',shipped:'Enviado',delivered:'Entregado',cancelled:'Cancelado',refunded:'Reembolsado'};
function money(n){return Number(n||0).toFixed(2).replace('.',',')+' €'}
function loginBox(message=''){document.getElementById('app').innerHTML='<div class="panel" style="max-width:460px"><h2>Acceso privado</h2><p class="muted">Inicia sesión con tu cuenta de Mon Impasse para entrar al panel.</p><input id="ae" type="email" placeholder="Tu email" style="width:100%;padding:12px;border:1px solid #d9cec6;margin:12px 0 8px;box-sizing:border-box"><input id="ap" type="password" placeholder="Contraseña" style="width:100%;padding:12px;border:1px solid #d9cec6;box-sizing:border-box"><button class="button" style="margin-top:12px;width:100%" onclick="doLogin()">Entrar</button><div class="muted" style="margin-top:12px">'+message+'</div></div>'}
async function doLogin(){const email=document.getElementById('ae').value.trim(),password=document.getElementById('ap').value;if(!email||!password)return loginBox('Introduce email y contraseña.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return loginBox('No se ha podido iniciar sesión. Comprueba los datos.');await init()}
async function init(){try{const result=await Promise.race([sb.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),5000))]);const session=result?.data?.session;if(!session){loginBox();return}const {data:isAdmin,error:adminError}=await sb.rpc('is_admin');if(adminError||!isAdmin){document.getElementById('app').innerHTML='<div class="error">Esta cuenta no tiene permisos de administración.</div>';return}await load()}catch(e){loginBox('La sesión ha tardado demasiado. Vuelve a iniciar sesión aquí.')}}
async function load(){const since=new Date();since.setDate(since.getDate()-30);const [{data:events,error:e1},{data:orders,error:e2}]=await Promise.all([sb.from('site_events').select('*').gte('created_at',since.toISOString()).order('created_at',{ascending:false}),sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100)]);if(e1||e2){document.getElementById('app').innerHTML='<div class="error">No se han podido cargar las estadísticas.</div>';return}const ev=events||[],os=orders||[];const views=ev.filter(x=>x.event_type==='page_view').length, carts=ev.filter(x=>x.event_type==='add_to_cart').length, purchases=os.filter(x=>['paid','preparing','shipped','delivered'].includes(x.status));const revenue=purchases.reduce((s,x)=>s+Number(x.total_amount||0),0);const unique=new Set(ev.filter(x=>x.event_type==='page_view').map(x=>x.session_id)).size;const product={};ev.filter(x=>x.event_type==='add_to_cart').forEach(x=>product[x.product_name]=(product[x.product_name]||0)+Number(x.quantity||1));const top=Object.entries(product).sort((a,b)=>b[1]-a[1]).slice(0,8);document.getElementById('app').innerHTML='<div class="cards"><div class="card"><div class="label">Visitas · 30 días</div><div class="num">'+views+'</div></div><div class="card"><div class="label">Visitantes</div><div class="num">'+unique+'</div></div><div class="card"><div class="label">Añadidos al carrito</div><div class="num">'+carts+'</div></div><div class="card"><div class="label">Facturación</div><div class="num">'+money(revenue)+'</div></div></div><div class="grid"><div class="panel"><h2>Productos añadidos al carrito</h2>'+(top.length?top.map(x=>'<div class="row"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join(''):'<div class="muted">Todavía no hay datos.</div>')+'</div><div class="panel"><h2>Resumen de pedidos</h2><div class="row"><span>Pedidos</span><strong>'+purchases.length+'</strong></div><div class="row"><span>Ticket medio</span><strong>'+money(purchases.length?revenue/purchases.length:0)+'</strong></div><div class="row"><span>Conversión visita → compra</span><strong>'+ (views?((purchases.length/views)*100).toFixed(1):'0')+'%</strong></div><div class="row"><span>Últimos 30 días</span><strong>Actualizado ahora</strong></div></div></div><div class="panel orders"><h2>Pedidos</h2>'+ (os.length?os.map(o=>'<div class="row"><span><strong>'+o.order_number+'</strong><br><span class="muted">'+new Date(o.created_at).toLocaleString('es-ES')+' · '+(o.customer_name||o.customer_email||'')+'</span></span><span><span class="status">'+(labels[o.status]||o.status)+'</span> &nbsp; <strong>'+money(o.total_amount)+'</strong></span></div>').join(''):'<div class="muted">No hay pedidos todavía.</div>')+'</div>'}
async function logout(){await sb.auth.signOut();location.href='/'}
init();
</script></body></html>
