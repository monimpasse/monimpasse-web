<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Impasse · Administración</title><!-- admin-login-fix -->
<style>
body{font-family:Arial,sans-serif;background:#faf8f5;color:#292421;margin:0}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-family:Georgia,serif;font-size:30px}.button{border:0;background:#c9b2a5;color:white;padding:11px 16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;padding:20px;border:1px solid #eee1d9}.label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#81766f}.num{font:28px Georgia,serif;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;padding:20px;border:1px solid #eee1d9}.panel h2{font:24px Georgia,serif;margin:0 0 15px}.bar{display:flex;gap:5px;align-items:flex-end;height:170px;border-bottom:1px solid #ddd}.bar i{display:block;background:#c9b2a5;min-width:18px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee6df;padding:10px 0;font-size:13px}.orders{margin-top:18px}.status{padding:4px 8px;background:#eee6df;font-size:11px}.muted{color:#81766f;font-size:12px}.error{text-align:center;padding:60px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{border:1px solid #d9cec6;background:#fff;padding:8px 12px;cursor:pointer}.filters button.active{background:#332e2b;color:#fff}@media(max-width:750px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="logo">Mon Impasse</div><div class="muted">Panel de administración</div></div><button class="button" onclick="logout()">Cerrar sesión</button></div>
<div id="app">Comprobando acceso…</div></div>
<script>
const URL='https://pgunvsjrytujpkjbwyaz.supabase.co',KEY='sb_publishable_0rYYngytqQIWsQ2oKL7VsA_MwybRQWA';
let accessToken=localStorage.getItem('mi_admin_token')||'';
const labels={pending:'Pendiente',paid:'Pagado',preparing:'En preparación',shipped:'Enviado',delivered:'Entregado',cancelled:'Cancelado',refunded:'Reembolsado'};
function money(n){return Number(n||0).toFixed(2).replace('.',',')+' €'}
async function auth(path,body){const r=await fetch(URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});return {ok:r.ok,data:await r.json()}}
function loginBox(message=''){document.getElementById('app').innerHTML='<div class="panel" style="max-width:460px"><h2>Acceso privado</h2><p class="muted">Introduce tu email y contraseña.</p><input id="ae" type="email" value="mdm__1990@hotmail.com" placeholder="Tu email" style="width:100%;padding:12px;border:1px solid #d9cec6;margin:12px 0 8px;box-sizing:border-box"><input id="ap" type="password" placeholder="Contraseña" style="width:100%;padding:12px;border:1px solid #d9cec6;box-sizing:border-box"><button class="button" style="margin-top:12px;width:100%" onclick="doLogin()">Entrar</button><button type="button" style="margin-top:10px;width:100%;padding:10px;background:none;border:0;text-decoration:underline;cursor:pointer" onclick="resetPassword()">Crear / recuperar contraseña</button><div class="muted" style="margin-top:12px">'+message+'</div></div>'}
async function doLogin(){const email=document.getElementById('ae').value.trim(),password=document.getElementById('ap').value;const r=await auth('token?grant_type=password',{email,password});if(!r.ok)return loginBox('No se ha podido iniciar sesión.');accessToken=r.data.access_token;localStorage.setItem('mi_admin_token',accessToken);await init()}
async function resetPassword(){const email=document.getElementById('ae').value.trim();const r=await fetch(URL+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:'https://monimpasse.com/admin.html'})});loginBox(r.ok?'Te hemos enviado el correo. Revisa también Spam.':'No se pudo enviar el correo: '+(r.data?.msg||'error'))}
async function api(path){const r=await fetch(URL+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+accessToken}});return {ok:r.ok,data:await r.json()}}
async function init(){const hash=new URLSearchParams(location.hash.replace(/^#/,'&'));const recoveryToken=hash.get('access_token');if(recoveryToken){accessToken=recoveryToken;localStorage.setItem('mi_admin_token',accessToken)}if(hash.get('type')==='recovery'&&accessToken){document.getElementById('app').innerHTML='<div class="panel" style="max-width:460px"><h2>Crear contraseña</h2><input id="np" type="password" placeholder="Nueva contraseña" style="width:100%;padding:12px;box-sizing:border-box"><button class="button" style="margin-top:12px;width:100%" onclick="savePassword()">Guardar contraseña</button><div id="pm" class="muted" style="margin-top:12px"></div></div>';return}if(!accessToken){loginBox();return}const u=await fetch(URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+accessToken}});if(!u.ok){accessToken='';localStorage.removeItem('mi_admin_token');loginBox();return}const user=await u.json();const a=await api('admin_users?user_id=eq.'+encodeURIComponent(user.id)+'&select=user_id');if(!a.ok||!a.data.length){document.getElementById('app').innerHTML='<div class="error">Esta cuenta no tiene permisos de administración.</div>';return}await load()}
async function savePassword(){const p=document.getElementById('np').value;const r=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:p})});document.getElementById('pm').textContent=r.ok?'Contraseña guardada. Ya puedes entrar al panel.':'No se pudo guardar la contraseña.';if(r.ok){history.replaceState({},'',location.pathname);await init()}}
async function load(){const since=new Date(Date.now()-30*86400000).toISOString();const e=await api('site_events?created_at=gte.'+encodeURIComponent(since)+'&select=*&order=created_at.desc');const o=await api('orders?select=*,order_items(*)&order=created_at.desc&limit=100');if(!e.ok||!o.ok){document.getElementById('app').innerHTML='<div class="error">No se han podido cargar las estadísticas.</div>';return}const ev=e.data||[],os=o.data||[],views=ev.filter(x=>x.event_type==='page_view').length,carts=ev.filter(x=>x.event_type==='add_to_cart').length,p=os.filter(x=>['paid','preparing','shipped','delivered'].includes(x.status)),revenue=p.reduce((s,x)=>s+Number(x.total_amount||0),0),unique=new Set(ev.filter(x=>x.event_type==='page_view').map(x=>x.session_id)).size,prod={};ev.filter(x=>x.event_type==='add_to_cart').forEach(x=>prod[x.product_name]=(prod[x.product_name]||0)+Number(x.quantity||1));const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,8);document.getElementById('app').innerHTML='<div class="cards"><div class="card"><div class="label">Visitas · 30 días</div><div class="num">'+views+'</div></div><div class="card"><div class="label">Visitantes</div><div class="num">'+unique+'</div></div><div class="card"><div class="label">Añadidos al carrito</div><div class="num">'+carts+'</div></div><div class="card"><div class="label">Facturación</div><div class="num">'+money(revenue)+'</div></div></div><div class="grid"><div class="panel"><h2>Productos añadidos al carrito</h2>'+(top.length?top.map(x=>'<div class="row"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join(''):'<div class="muted">Todavía no hay datos.</div>')+'</div><div class="panel"><h2>Resumen de pedidos</h2><div class="row"><span>Pedidos</span><strong>'+p.length+'</strong></div><div class="row"><span>Ticket medio</span><strong>'+money(p.length?revenue/p.length:0)+'</strong></div><div class="row"><span>Conversión visita → compra</span><strong>'+(views?((p.length/views)*100).toFixed(1):'0')+'%</strong></div></div></div><div class="panel orders"><h2>Pedidos</h2>'+(os.length?os.map(x=>'<div class="row"><span><strong>'+x.order_number+'</strong><br><span class="muted">'+new Date(x.created_at).toLocaleString('es-ES')+' · '+(x.customer_name||x.customer_email||'')+'</span></span><span><span class="status">'+(labels[x.status]||x.status)+'</span> &nbsp; <strong>'+money(x.total_amount)+'</strong></span></div>').join(''):'<div class="muted">No hay pedidos todavía.</div>')+'</div>'}
function logout(){accessToken='';localStorage.removeItem('mi_admin_token');location.reload()}
window.doLogin=doLogin;window.resetPassword=resetPassword;window.savePassword=savePassword;window.logout=logout;init();
</script></body></html>
